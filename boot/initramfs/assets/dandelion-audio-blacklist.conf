# Do not let udev auto-load the dandelion audio modules early in boot.
# The AFE/codec power-up at that point makes an audible pop (the PMIC/codec
# supply is still ramping).  dandelion-audio.service loads them later.
blacklist snd_soc_mtk_common
blacklist snd_soc_mt6765_pcm
blacklist mt6765_mt6357
